# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gb-cuy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crcuy.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8D9303F109AD4B209D7FA76526C424FD }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D76CB01B7D574983952BC1CBEBE7E022 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crcuy.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8D9303F109AD4B209D7FA76526C424FD }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gb-cuy'
          slot-name: 'staging'
          images: 'crcuy.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8D9303F109AD4B209D7FA76526C424FD }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0E261E8593EE4F8B8F2DB57E95985D7A }}